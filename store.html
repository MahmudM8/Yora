<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Store — Yora</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,700;1,9..144,400&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --saffron: #E8830A; --saffron-light: #FDF0DC; --saffron-dark: #B5630A;
    --cream: #FBF6EF; --dark: #1A1208; --dark2: #2D2010;
    --mid: #6B5030; --muted: #A08060; --white: #FFFFFF;
    --purple: #6B21A8; --purple-light: #F3E8FF; --purple-dark: #4C1D95;
    --red: #C0392B; --red-light: #FDECEA;
    --border: rgba(26,18,8,0.1);
    --font-display: 'Fraunces', Georgia, serif;
    --font-body: 'DM Sans', system-ui, sans-serif;
  }
  html { scroll-behavior: smooth; }
  body { font-family: var(--font-body); background: var(--cream); color: var(--dark); min-height: 100vh; }

  nav { position: sticky; top: 0; z-index: 200; background: rgba(251,246,239,0.94); backdrop-filter: blur(12px); border-bottom: 1px solid var(--border); padding: 0 5%; height: 64px; display: flex; align-items: center; justify-content: space-between; }
  .nav-logo { font-family: var(--font-display); font-size: 26px; font-weight: 700; color: var(--dark); text-decoration: none; }
  .nav-logo span { color: var(--saffron); }
  .nav-back { display: flex; align-items: center; gap: 6px; font-size: 14px; font-weight: 500; color: var(--mid); text-decoration: none; transition: color 0.2s; }
  .nav-back:hover { color: var(--purple); }
  .nav-right { display: flex; align-items: center; gap: 12px; }
  .cart-nav-btn { display: none; align-items: center; gap: 8px; background: var(--purple); color: white; border: none; border-radius: 50px; font-family: var(--font-body); font-size: 14px; font-weight: 600; padding: 10px 20px; cursor: pointer; transition: all 0.2s; }
  .cart-nav-btn:hover { background: var(--purple-dark); }
  .cart-nav-btn.visible { display: flex; }
  .cart-badge { background: var(--saffron); color: white; font-size: 11px; font-weight: 700; width: 20px; height: 20px; border-radius: 50%; display: flex; align-items: center; justify-content: center; }

  /* STORE HEADER */
  .store-header { background: var(--purple-dark); position: relative; overflow: hidden; padding: 48px 5% 40px; }
  .store-header::before { content: ''; position: absolute; right: -80px; top: -80px; width: 500px; height: 500px; border-radius: 50%; background: radial-gradient(circle, rgba(255,255,255,0.08) 0%, transparent 60%); pointer-events: none; }
  .store-cover-emoji { position: absolute; right: 5%; bottom: -16px; font-size: 140px; opacity: 0.08; line-height: 1; pointer-events: none; }
  .breadcrumb { display: flex; align-items: center; gap: 6px; font-size: 13px; color: rgba(255,255,255,0.4); margin-bottom: 20px; }
  .breadcrumb a { color: rgba(255,255,255,0.4); text-decoration: none; }
  .breadcrumb a:hover { color: rgba(255,255,255,0.8); }
  .breadcrumb span { color: rgba(255,255,255,0.2); }
  .store-info-row { display: flex; align-items: flex-start; gap: 20px; }
  .store-logo-big { width: 72px; height: 72px; border-radius: 18px; background: rgba(255,255,255,0.1); border: 2px solid rgba(255,255,255,0.15); display: flex; align-items: center; justify-content: center; font-size: 38px; flex-shrink: 0; overflow: hidden; }
  .store-logo-big img { width: 100%; height: 100%; object-fit: cover; }
  .store-name { font-family: var(--font-display); font-size: clamp(26px,4vw,42px); font-weight: 700; color: white; letter-spacing: -0.8px; margin-bottom: 6px; }
  .store-desc { font-size: 14px; color: rgb(8, 8, 8); line-height: 1.6; max-width: 480px; margin-bottom: 16px; }
  .store-meta-row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .store-tag { display: inline-flex; align-items: center; gap: 5px; background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.12); color: rgba(255,255,255,0.7); font-size: 12px; font-weight: 600; padding: 5px 12px; border-radius: 50px; }
  .store-tag.open { background: rgba(107,33,168,0.4); border-color: rgba(167,139,250,0.4); color: #C4B5FD; }
  .store-tag.closed { background: rgba(255,255,255,0.06); color: rgba(255,255,255,0.4); }

  /* PRODUCTS LAYOUT */
  .products-layout { max-width: 1100px; margin: 0 auto; padding: 40px 5%; display: grid; grid-template-columns: 200px 1fr; gap: 40px; align-items: start; }
  .cat-sidebar { position: sticky; top: 84px; }
  .cat-sidebar-title { font-size: 11px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: 0.8px; margin-bottom: 10px; }
  .cat-list { display: flex; flex-direction: column; gap: 2px; }
  .cat-item { padding: 9px 14px; border-radius: 10px; font-size: 14px; font-weight: 500; color: var(--mid); cursor: pointer; transition: all 0.2s; text-decoration: none; display: block; }
  .cat-item:hover { background: var(--purple-light); color: var(--purple); }
  .cat-item.active { background: var(--purple-light); color: var(--purple); font-weight: 700; }

  .prod-section { margin-bottom: 48px; }
  .prod-section-title { font-family: var(--font-display); font-size: 22px; font-weight: 700; color: var(--dark); letter-spacing: -0.3px; margin-bottom: 20px; padding-bottom: 12px; border-bottom: 2px solid var(--purple-light); }
  .prod-items-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px,1fr)); gap: 20px; }

  /* PRODUCT CARD — image-first design */
  .prod-item { background: var(--white); border-radius: 16px; overflow: hidden; border: 1.5px solid transparent; transition: all 0.2s; display: flex; flex-direction: column; }
  .prod-item:hover { border-color: rgba(107,33,168,0.2); box-shadow: 0 6px 24px rgba(26,18,8,0.09); transform: translateY(-2px); }
  .prod-item.in-cart { border-color: var(--purple); }
  .prod-img-wrap { width: 100%; height: 160px; position: relative; background: var(--purple-light); overflow: hidden; flex-shrink: 0; }
  .prod-img-wrap img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .prod-emoji-fallback { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; font-size: 56px; }
  .prod-body { padding: 14px; flex: 1; display: flex; flex-direction: column; }
  .prod-name { font-size: 14px; font-weight: 700; color: var(--dark); margin-bottom: 4px; }
  .prod-desc { font-size: 12px; color: var(--muted); line-height: 1.4; margin-bottom: 10px; flex: 1; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .prod-footer { display: flex; align-items: center; justify-content: space-between; margin-top: auto; }
  .prod-price { font-size: 16px; font-weight: 700; color: var(--purple); }
  .prod-unavailable { font-size: 11px; color: var(--muted); font-weight: 600; }
  .qty-control { display: flex; align-items: center; gap: 8px; }
  .qty-btn { width: 28px; height: 28px; border-radius: 50%; border: none; font-size: 16px; font-weight: 700; cursor: pointer; transition: all 0.15s; display: flex; align-items: center; justify-content: center; font-family: var(--font-body); }
  .qty-btn.minus { background: rgba(26,18,8,0.08); color: var(--dark); }
  .qty-btn.minus:hover { background: var(--red-light); color: var(--red); }
  .qty-btn.plus { background: var(--purple); color: white; }
  .qty-btn.plus:hover { background: var(--purple-dark); }
  .qty-num { font-size: 15px; font-weight: 700; color: var(--dark); min-width: 16px; text-align: center; }
  .add-btn { background: var(--purple); color: white; border: none; border-radius: 50px; font-family: var(--font-body); font-size: 12px; font-weight: 700; padding: 7px 14px; cursor: pointer; transition: all 0.2s; white-space: nowrap; }
  .add-btn:hover { background: var(--purple-dark); }

  /* SKELETON */
  .skeleton-item { background: var(--white); border-radius: 16px; overflow: hidden; }
  .skel-img { height: 160px; background: linear-gradient(90deg,#f0e8ff 25%,#f8f2ff 50%,#f0e8ff 75%); background-size: 200% 100%; animation: shimmer 1.4s infinite; }
  .skel-body { padding: 14px; }
  .skel-line { height: 13px; border-radius: 6px; background: linear-gradient(90deg,#f0e8ff 25%,#f8f2ff 50%,#f0e8ff 75%); background-size: 200% 100%; animation: shimmer 1.4s infinite; margin-bottom: 8px; }
  .skel-line.short { width: 50%; }
  @keyframes shimmer { 0%{background-position:200% 0} 100%{background-position:-200% 0} }

  /* CART DRAWER */
  .cart-overlay { position: fixed; inset: 0; background: rgba(26,18,8,0.5); z-index: 300; opacity: 0; pointer-events: none; transition: opacity 0.3s; backdrop-filter: blur(2px); }
  .cart-overlay.open { opacity: 1; pointer-events: all; }
  .cart-drawer { position: fixed; top: 0; right: 0; bottom: 0; width: 420px; max-width: 100vw; background: var(--white); z-index: 400; display: flex; flex-direction: column; transform: translateX(100%); transition: transform 0.35s cubic-bezier(0.32,0.72,0,1); box-shadow: -8px 0 48px rgba(26,18,8,0.15); }
  .cart-drawer.open { transform: translateX(0); }
  .cart-header { padding: 20px 24px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; flex-shrink: 0; }
  .cart-title { font-family: var(--font-display); font-size: 22px; font-weight: 700; color: var(--dark); }
  .cart-close { width: 36px; height: 36px; border-radius: 50%; background: var(--cream); border: none; cursor: pointer; font-size: 18px; display: flex; align-items: center; justify-content: center; transition: background 0.2s; color: var(--dark); }
  .cart-close:hover { background: rgba(26,18,8,0.1); }
  .cart-store-name { padding: 10px 24px; background: var(--purple-light); font-size: 13px; font-weight: 600; color: var(--purple); border-bottom: 1px solid rgba(107,33,168,0.12); flex-shrink: 0; }
  .cart-items { flex: 1; overflow-y: auto; padding: 16px 24px; }
  .cart-item { display: flex; align-items: center; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--border); }
  .cart-item:last-child { border-bottom: none; }
  .ci-img { width: 44px; height: 44px; border-radius: 10px; background: var(--purple-light); overflow: hidden; flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-size: 22px; }
  .ci-img img { width: 100%; height: 100%; object-fit: cover; }
  .ci-info { flex: 1; min-width: 0; }
  .ci-name { font-size: 14px; font-weight: 600; color: var(--dark); }
  .ci-price { font-size: 13px; color: var(--muted); margin-top: 2px; }
  .ci-qty-control { display: flex; align-items: center; gap: 8px; }
  .ci-qty-btn { width: 26px; height: 26px; border-radius: 50%; border: none; font-size: 14px; font-weight: 700; cursor: pointer; display: flex; align-items: center; justify-content: center; font-family: var(--font-body); transition: all 0.15s; }
  .ci-qty-btn.minus { background: rgba(26,18,8,0.08); color: var(--dark); }
  .ci-qty-btn.minus:hover { background: var(--red-light); color: var(--red); }
  .ci-qty-btn.plus { background: var(--purple); color: white; }
  .ci-qty-btn.plus:hover { background: var(--purple-dark); }
  .ci-qty-num { font-size: 14px; font-weight: 700; color: var(--dark); min-width: 16px; text-align: center; }
  .cart-empty { text-align: center; padding: 60px 20px; display: none; }
  .cart-empty.show { display: block; }
  .cart-empty-icon { font-size: 48px; margin-bottom: 12px; }
  .cart-empty-text { font-size: 14px; color: var(--muted); }

  .cart-details { padding: 16px 24px; border-top: 1px solid var(--border); flex-shrink: 0; }
  .cart-details-title { font-size: 13px; font-weight: 700; color: var(--dark); margin-bottom: 12px; }
  .cart-field { margin-bottom: 10px; }
  .cart-field label { font-size: 12px; font-weight: 600; color: var(--mid); display: block; margin-bottom: 4px; }
  .cart-field input, .cart-field textarea { width: 100%; padding: 10px 12px; border-radius: 10px; border: 1.5px solid var(--border); background: var(--cream); font-family: var(--font-body); font-size: 13px; color: var(--dark); outline: none; transition: border-color 0.2s; resize: none; }
  .cart-field input:focus, .cart-field textarea:focus { border-color: var(--purple); }
  .cart-field input.error { border-color: var(--red); }

  .cart-footer { padding: 16px 24px 24px; border-top: 1px solid var(--border); flex-shrink: 0; background: var(--white); }
  .cart-summary { margin-bottom: 14px; }
  .cart-summary-row { display: flex; justify-content: space-between; font-size: 13px; color: var(--mid); margin-bottom: 6px; }
  .cart-summary-row.total { font-size: 16px; font-weight: 700; color: var(--dark); margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--border); }
  .fee-note { font-size: 11px; color: var(--muted); margin-top: 2px; }

  .btn-whatsapp { width: 100%; padding: 15px; background: #25D366; color: white; border: none; border-radius: 14px; font-family: var(--font-body); font-size: 15px; font-weight: 700; cursor: pointer; transition: all 0.25s; display: flex; align-items: center; justify-content: center; gap: 10px; }
  .btn-whatsapp:hover { background: #1EB358; transform: translateY(-1px); box-shadow: 0 6px 20px rgba(37,211,102,0.35); }
  .btn-whatsapp:disabled { opacity: 0.5; cursor: not-allowed; transform: none; box-shadow: none; }
  .btn-whatsapp.signin { background: var(--dark); }
  .btn-whatsapp.signin:hover { background: var(--dark2); box-shadow: none; }
  .wa-icon { width: 20px; height: 20px; flex-shrink: 0; }

  .float-cart-bar { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: var(--purple); color: white; border-radius: 50px; padding: 14px 24px; display: none; align-items: center; gap: 16px; box-shadow: 0 8px 32px rgba(107,33,168,0.3); z-index: 150; min-width: 260px; cursor: pointer; transition: all 0.3s; border: none; font-family: var(--font-body); }
  .float-cart-bar.visible { display: flex; }
  .float-cart-bar:hover { background: var(--purple-dark); transform: translateX(-50%) translateY(-2px); }
  .fcb-left { display: flex; align-items: center; gap: 10px; }
  .fcb-badge { background: var(--saffron); color: white; font-size: 12px; font-weight: 700; width: 24px; height: 24px; border-radius: 50%; display: flex; align-items: center; justify-content: center; }
  .fcb-text { font-size: 14px; font-weight: 600; }
  .fcb-total { font-size: 15px; font-weight: 700; color: rgba(255,255,255,0.85); margin-left: auto; }

  .auth-modal-overlay { position: fixed; inset: 0; background: rgba(26,18,8,0.55); z-index: 1000; display: none; align-items: center; justify-content: center; padding: 20px; backdrop-filter: blur(4px); }
  .auth-modal-overlay.open { display: flex; }
  .auth-modal { background: var(--white); border-radius: 24px; width: 100%; max-width: 400px; padding: 40px 36px; text-align: center; box-shadow: 0 24px 64px rgba(26,18,8,0.2); position: relative; animation: modalIn 0.25s ease; }
  @keyframes modalIn { from{opacity:0;transform:scale(0.94) translateY(12px)} to{opacity:1;transform:scale(1) translateY(0)} }
  .auth-modal-close { position: absolute; top: 14px; right: 14px; width: 32px; height: 32px; border-radius: 50%; background: var(--cream); border: none; cursor: pointer; font-size: 16px; color: var(--dark); display: flex; align-items: center; justify-content: center; }
  .auth-modal-icon { font-size: 48px; margin-bottom: 16px; }
  .auth-modal-title { font-family: var(--font-display); font-size: 24px; font-weight: 700; color: var(--dark); margin-bottom: 8px; }
  .auth-modal-sub { font-size: 14px; color: var(--muted); line-height: 1.6; margin-bottom: 28px; }
  .auth-modal-btns { display: flex; flex-direction: column; gap: 10px; }
  .auth-modal-primary { display: block; width: 100%; padding: 14px; background: var(--saffron); color: white; border: none; border-radius: 12px; font-family: var(--font-body); font-size: 15px; font-weight: 700; cursor: pointer; text-decoration: none; transition: all 0.2s; }
  .auth-modal-primary:hover { background: var(--saffron-dark); }
  .auth-modal-secondary { display: block; width: 100%; padding: 13px; background: transparent; color: var(--dark); border: 1.5px solid var(--border); border-radius: 12px; font-family: var(--font-body); font-size: 15px; font-weight: 600; cursor: pointer; text-decoration: none; transition: all 0.2s; }
  .auth-modal-secondary:hover { border-color: var(--saffron); color: var(--saffron); }

  @media (max-width: 860px) {
    .products-layout { grid-template-columns: 1fr; }
    .cat-sidebar { display: none; }
    .cart-drawer { width: 100vw; }
    .float-cart-bar { display: none !important; }
    .cart-nav-btn { display: flex !important; }
  }
  @media (max-width: 500px) {
    nav .nav-back span { display: none; }
    .store-info-row { flex-direction: column; gap: 12px; }
    .prod-items-grid { grid-template-columns: repeat(auto-fill,minmax(160px,1fr)); }
  }
</style>
</head>
<body>

<nav>
  <a href="index.html" class="nav-logo">Yora<span>.</span></a>
  <div class="nav-right">
    <a href="stores.html" class="nav-back">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 5l-7 7 7 7"/></svg>
      <span>Stores</span>
    </a>
    <button class="cart-nav-btn" id="cartNavBtn" onclick="openCart()">
      🛒 Cart <span class="cart-badge" id="cartNavBadge">0</span>
    </button>
  </div>
</nav>

<div class="store-header">
  <div class="breadcrumb">
    <a href="index.html">Home</a><span>/</span>
    <a href="stores.html">Stores</a><span>/</span>
    <span id="breadcrumbName">Loading…</span>
  </div>
  <span class="store-cover-emoji" id="headerCoverEmoji"></span>
  <img id="headerCoverImage" style="display:none;position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0.18;" alt="">
  <div class="store-info-row">
    <div class="store-logo-big" id="headerLogo">🏪</div>
    <div>
      <div class="store-name" id="headerName">Loading…</div>
      <div class="store-desc" id="headerDesc"></div>
      <div class="store-meta-row" id="headerMeta"></div>
    </div>
  </div>
</div>

<div class="products-layout">
  <aside class="cat-sidebar">
    <div class="cat-sidebar-title">Categories</div>
    <nav class="cat-list" id="catList"></nav>
  </aside>
  <div id="productsContent">
    <div id="prodSkeleton">
      <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:20px;">
        <div class="skeleton-item"><div class="skel-img"></div><div class="skel-body"><div class="skel-line"></div><div class="skel-line short"></div></div></div>
        <div class="skeleton-item"><div class="skel-img"></div><div class="skel-body"><div class="skel-line"></div><div class="skel-line short"></div></div></div>
        <div class="skeleton-item"><div class="skel-img"></div><div class="skel-body"><div class="skel-line"></div><div class="skel-line short"></div></div></div>
        <div class="skeleton-item"><div class="skel-img"></div><div class="skel-body"><div class="skel-line"></div><div class="skel-line short"></div></div></div>
      </div>
    </div>
    <div id="prodSections"></div>
  </div>
</div>

<button class="float-cart-bar" id="floatCartBar" onclick="openCart()">
  <div class="fcb-left">
    <div class="fcb-badge" id="fcbBadge">0</div>
    <span class="fcb-text" id="fcbText">View cart</span>
  </div>
  <span class="fcb-total" id="fcbTotal">₦0</span>
</button>

<div class="cart-overlay" id="cartOverlay" onclick="closeCart()"></div>
<div class="cart-drawer" id="cartDrawer">
  <div class="cart-header">
    <div class="cart-title">Your cart</div>
    <button class="cart-close" onclick="closeCart()">✕</button>
  </div>
  <div class="cart-store-name" id="cartStoreName">—</div>
  <div class="cart-items" id="cartItemsList">
    <div class="cart-empty show" id="cartEmpty">
      <div class="cart-empty-icon">🛍️</div>
      <div class="cart-empty-text">Your cart is empty.<br>Add products from the store.</div>
    </div>
  </div>
  <div class="cart-details" id="cartDetailsForm" style="display:none;">
    <div class="cart-details-title">Delivery details</div>
    <div class="cart-field">
      <label for="deliveryAddress">Delivery address *</label>
      <input type="text" id="deliveryAddress" placeholder="e.g. No. 12 Hospital Road, Jimeta">
    </div>
    <div class="cart-field">
      <label for="customerPhone">Phone number *</label>
      <input type="tel" id="customerPhone" placeholder="e.g. 08012345678">
    </div>
    <div class="cart-field">
      <label for="specialNotes">Additional notes (optional)</label>
      <textarea id="specialNotes" rows="2" placeholder="e.g. Specific size, colour, variant…"></textarea>
    </div>
  </div>
  <div class="cart-footer" id="cartFooter" style="display:none;">
    <div class="cart-summary" id="cartSummary"></div>
    <button class="btn-whatsapp" id="whatsappBtn" onclick="placeOrder()">
      <svg class="wa-icon" viewBox="0 0 24 24" fill="white"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347z"/><path d="M12 0C5.373 0 0 5.373 0 12c0 2.098.543 4.067 1.494 5.783L0 24l6.317-1.494A11.936 11.936 0 0012 24c6.627 0 12-5.373 12-12S18.627 0 12 0zm0 22c-1.885 0-3.646-.494-5.165-1.36l-.371-.217-3.748.886.921-3.654-.239-.389A9.946 9.946 0 012 12C2 6.477 6.477 2 12 2s10 4.477 10 10-4.477 10-10 10z"/></svg>
      <span id="whatsappBtnText">Send order via WhatsApp</span>
    </button>
  </div>
</div>

<div class="auth-modal-overlay" id="authGateModal">
  <div class="auth-modal">
    <button class="auth-modal-close" onclick="closeAuthGate()">✕</button>
    <div class="auth-modal-icon">🔐</div>
    <div class="auth-modal-title">Sign in to order</div>
    <p class="auth-modal-sub">You need a free Yora account to place orders. It only takes 30 seconds.</p>
    <div class="auth-modal-btns">
      <a href="signup.html" class="auth-modal-primary">Create free account</a>
      <a href="signup.html" class="auth-modal-secondary">Log in</a>
    </div>
  </div>
</div>

<script>
  const SUPABASE_URL      = 'https://fdwkdgqhnjyfupyevtkp.supabase.co';
  const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZkd2tkZ3Fobmp5ZnVweWV2dGtwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA2NjE2NjQsImV4cCI6MjA5NjIzNzY2NH0.g6ahJ2AfBbCtkeBKSOtfl0zzxUku5oE-zmp6AyiFaro';

  const SERVICE_FEE = 200;
  let sb, store = null, currentUser = null, cart = {};

  function cartCount()    { return Object.values(cart).reduce((s,v)=>s+v.qty,0); }
  function cartSubtotal() { return Object.values(cart).reduce((s,v)=>s+v.product.price*v.qty,0); }
  function cartTotal()    { return cartSubtotal() + (cartCount()>0?SERVICE_FEE:0); }

  function addToCart(product) {
    if (cart[product.id]) cart[product.id].qty++;
    else cart[product.id] = {product,qty:1};
    updateCartUI(); updateProdCard(product.id);
  }

  function removeFromCart(productId) {
    if (!cart[productId]) return;
    cart[productId].qty--;
    if (cart[productId].qty <= 0) delete cart[productId];
    updateCartUI(); updateProdCard(productId);
  }

  function updateProdCard(productId) {
    const card = document.querySelector('[data-item-id="'+productId+'"]');
    if (!card) return;
    const qty = cart[productId]?.qty || 0;
    const addBtn  = card.querySelector('.add-btn');
    const qtyWrap = card.querySelector('.qty-control');
    const qtyNum  = card.querySelector('.qty-num');
    if (qty > 0) {
      card.classList.add('in-cart');
      if (addBtn)  addBtn.style.display  = 'none';
      if (qtyWrap) qtyWrap.style.display = 'flex';
      if (qtyNum)  qtyNum.textContent    = qty;
    } else {
      card.classList.remove('in-cart');
      if (addBtn)  addBtn.style.display  = 'block';
      if (qtyWrap) qtyWrap.style.display = 'none';
    }
  }

  function updateCartUI() {
    const count    = cartCount();
    const subtotal = cartSubtotal();
    const total    = cartTotal();

    document.getElementById('cartNavBtn').classList.toggle('visible', count>0);
    document.getElementById('cartNavBadge').textContent = count;
    document.getElementById('floatCartBar').classList.toggle('visible', count>0);
    document.getElementById('fcbBadge').textContent = count;
    document.getElementById('fcbText').textContent  = count+' item'+(count!==1?'s':'');
    document.getElementById('fcbTotal').textContent = '₦'+total.toLocaleString();

    const list  = document.getElementById('cartItemsList');
    const empty = document.getElementById('cartEmpty');
    list.querySelectorAll('.cart-item').forEach(el=>el.remove());

    if (count === 0) {
      empty.classList.add('show');
    } else {
      empty.classList.remove('show');
      Object.values(cart).forEach(({product,qty}) => {
        const row = document.createElement('div');
        row.className = 'cart-item';
        const imgHtml = product.image_url
          ? '<div class="ci-img"><img src="'+product.image_url+'" alt="'+product.name+'"></div>'
          : '<div class="ci-img">'+(product.emoji||'📦')+'</div>';
        row.innerHTML =
          imgHtml+
          '<div class="ci-info"><div class="ci-name">'+product.name+'</div>'+
          '<div class="ci-price">₦'+(product.price*qty).toLocaleString()+'</div></div>'+
          '<div class="ci-qty-control">'+
          '<button class="ci-qty-btn minus" onclick="removeFromCart(\''+product.id+'\')">−</button>'+
          '<span class="ci-qty-num">'+qty+'</span>'+
          '<button class="ci-qty-btn plus" onclick="addToCart('+JSON.stringify(product).replace(/"/g,'&quot;')+')">+</button>'+
          '</div>';
        list.appendChild(row);
      });
    }

    document.getElementById('cartSummary').innerHTML =
      '<div class="cart-summary-row"><span>Subtotal</span><span>₦'+subtotal.toLocaleString()+'</span></div>'+
      '<div class="cart-summary-row"><span>Service fee<div class="fee-note">Yora platform fee</div></span><span>₦'+(count>0?SERVICE_FEE:0).toLocaleString()+'</span></div>'+
      '<div class="cart-summary-row total"><span>Total</span><span>₦'+total.toLocaleString()+'</span></div>';

    document.getElementById('whatsappBtn').disabled = count===0;
    document.getElementById('cartDetailsForm').style.display = count>0?'block':'none';
    document.getElementById('cartFooter').style.display      = count>0?'block':'none';

    const btn = document.getElementById('whatsappBtn');
    const btnText = document.getElementById('whatsappBtnText');
    if (!currentUser) { btnText.textContent='Sign in to order'; btn.classList.add('signin'); }
    else              { btnText.textContent='Send order via WhatsApp'; btn.classList.remove('signin'); }
  }

  function openCart()  { document.getElementById('cartDrawer').classList.add('open'); document.getElementById('cartOverlay').classList.add('open'); document.body.style.overflow='hidden'; }
  function closeCart() { document.getElementById('cartDrawer').classList.remove('open'); document.getElementById('cartOverlay').classList.remove('open'); document.body.style.overflow=''; }

  function openAuthGate() {
    sessionStorage.setItem('yora_redirect', window.location.href);
    document.getElementById('authGateModal').classList.add('open');
    document.body.style.overflow='hidden';
  }
  function closeAuthGate() { document.getElementById('authGateModal').classList.remove('open'); document.body.style.overflow=''; }
  document.getElementById('authGateModal').addEventListener('click', e => { if(e.target===document.getElementById('authGateModal')) closeAuthGate(); });

  function placeOrder() {
    if (!currentUser) { openAuthGate(); return; }
    const address = document.getElementById('deliveryAddress').value.trim();
    const phone   = document.getElementById('customerPhone').value.trim();
    const notes   = document.getElementById('specialNotes').value.trim();
    let valid = true;
    if (!address) { document.getElementById('deliveryAddress').classList.add('error'); valid=false; }
    else            document.getElementById('deliveryAddress').classList.remove('error');
    if (!phone)   { document.getElementById('customerPhone').classList.add('error'); valid=false; }
    else            document.getElementById('customerPhone').classList.remove('error');
    if (!valid) return;

    const userName = currentUser.user_metadata?.full_name || 'Customer';
    let msg = '*🛍️ STORE ORDER — Yora*\n\n';
    msg += '*Store:* '+store.name+'\n';
    msg += '*Customer:* '+userName+'\n';
    msg += '*Phone:* '+phone+'\n';
    msg += '*Delivery address:* '+address+'\n\n';
    msg += '*Items ordered:*\n';
    Object.values(cart).forEach(({product,qty}) => {
      msg += '• '+product.name+' x'+qty+' — ₦'+(product.price*qty).toLocaleString()+'\n';
    });
    msg += '\n*Subtotal:* ₦'+cartSubtotal().toLocaleString();
    msg += '\n*Service fee:* ₦'+SERVICE_FEE.toLocaleString();
    msg += '\n*Total:* ₦'+cartTotal().toLocaleString();
    if (notes) msg += '\n\n*Notes:* '+notes;
    msg += '\n\n_Sent via Yora — Yola\'s marketplace_';

    let waNumber = store.whatsapp_number.replace(/\D/g,'');
    if (waNumber.startsWith('0'))                              waNumber = '234'+waNumber.slice(1);
    if (!waNumber.startsWith('234') && waNumber.length <= 10) waNumber = '234'+waNumber;

    const a = document.createElement('a');
    a.href='https://wa.me/'+waNumber+'?text='+encodeURIComponent(msg);
    a.target='_blank'; a.rel='noopener noreferrer';
    document.body.appendChild(a); a.click(); document.body.removeChild(a);

    if (currentUser) {
      sb.from('orders').insert({
        user_id: currentUser.id,
        business_name: store.name,
        category: 'store',
        items: Object.values(cart).map(({product,qty})=>({name:product.name,qty,price:product.price})),
        total: cartTotal(), address, notes,
      }).then(()=>{});
    }
  }

  function renderProducts(products) {
    const groups = {};
    products.forEach(p => {
      const cat = p.category || 'Products';
      if (!groups[cat]) groups[cat] = [];
      groups[cat].push(p);
    });

    const sectionsEl = document.getElementById('prodSections');
    const catListEl  = document.getElementById('catList');
    sectionsEl.innerHTML = ''; catListEl.innerHTML = '';

    Object.entries(groups).forEach(([cat,items],gi) => {
      const link = document.createElement('a');
      link.className   = 'cat-item'+(gi===0?' active':'');
      link.href        = '#cat-'+cat.replace(/\s+/g,'-');
      link.textContent = cat;
      link.addEventListener('click', e => {
        e.preventDefault();
        document.querySelectorAll('.cat-item').forEach(c=>c.classList.remove('active'));
        link.classList.add('active');
        document.getElementById('cat-'+cat.replace(/\s+/g,'-'))?.scrollIntoView({behavior:'smooth',block:'start'});
      });
      catListEl.appendChild(link);

      const section = document.createElement('div');
      section.className = 'prod-section';
      section.id = 'cat-'+cat.replace(/\s+/g,'-');
      const titleEl = document.createElement('div');
      titleEl.className = 'prod-section-title'; titleEl.textContent = cat;
      section.appendChild(titleEl);

      const grid = document.createElement('div');
      grid.className = 'prod-items-grid';

      items.forEach(product => {
        const card = document.createElement('div');
        card.className = 'prod-item';
        card.setAttribute('data-item-id', product.id);
        const qtyInCart = cart[product.id]?.qty || 0;
        if (qtyInCart > 0) card.classList.add('in-cart');

        const imgHtml = product.image_url
          ? '<div class="prod-img-wrap"><img src="'+product.image_url+'" alt="'+product.name+'" loading="lazy"></div>'
          : '<div class="prod-img-wrap"><div class="prod-emoji-fallback">'+(product.emoji||'📦')+'</div></div>';

        card.innerHTML =
          imgHtml+
          '<div class="prod-body">'+
            '<div class="prod-name">'+product.name+'</div>'+
            '<div class="prod-desc">'+(product.description||'')+'</div>'+
            '<div class="prod-footer">'+
              '<div class="prod-price">₦'+Number(product.price).toLocaleString()+'</div>'+
              (product.is_available
                ? '<button class="add-btn" style="display:'+(qtyInCart>0?'none':'block')+'" onclick=\'addToCart('+JSON.stringify(product)+')\'>+ Add</button>'+
                  '<div class="qty-control" style="display:'+(qtyInCart>0?'flex':'none')+'">'+
                    '<button class="qty-btn minus" onclick=\'removeFromCart("'+product.id+'")\'>−</button>'+
                    '<span class="qty-num">'+qtyInCart+'</span>'+
                    '<button class="qty-btn plus" onclick=\'addToCart('+JSON.stringify(product)+')\'>+</button>'+
                  '</div>'
                : '<span class="prod-unavailable">Out of stock</span>'
              )+
            '</div>'+
          '</div>';
        grid.appendChild(card);
      });

      section.appendChild(grid);
      sectionsEl.appendChild(section);
    });
  }

  async function loadPage() {
    sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    const params = new URLSearchParams(window.location.search);
    const id = params.get('id');
    if (!id) { window.location.href='stores.html'; return; }

    try {
      const { data:{ session } } = await sb.auth.getSession();
      currentUser = session?.user || null;
    } catch(e) { currentUser = null; }

    const { data: biz, error } = await sb.from('businesses').select('*').eq('id',id).single();
    if (error || !biz) { window.location.href='stores.html'; return; }

    store = biz;
    document.title = biz.name+' — Yora';
    document.getElementById('breadcrumbName').textContent = biz.name;
    document.getElementById('headerName').textContent     = biz.name;
    document.getElementById('headerDesc').textContent     = biz.description||'';
    document.getElementById('cartStoreName').textContent  = biz.name;

    const coverEmojiEl = document.getElementById('headerCoverEmoji');
    const coverImageEl = document.getElementById('headerCoverImage');
    const logoEl       = document.getElementById('headerLogo');
    if (biz.cover_image_url) {
      coverImageEl.src = biz.cover_image_url; coverImageEl.style.display='block';
      coverEmojiEl.style.display='none';
      logoEl.innerHTML = '<img src="'+biz.cover_image_url+'" style="width:100%;height:100%;object-fit:cover;border-radius:16px;">';
    } else {
      coverEmojiEl.textContent = biz.cover_emoji||'🛍️';
      coverImageEl.style.display='none';
      logoEl.textContent = biz.logo_emoji||'🏪';
    }

    const SUBCAT_LABELS = {groceries:'Groceries',fashion:'Fashion',electronics:'Electronics',household:'Household',beauty:'Beauty'};
    const subcatLabel   = biz.store_category ? SUBCAT_LABELS[biz.store_category]||biz.store_category : '';

    document.getElementById('headerMeta').innerHTML = [
      '<span class="store-tag '+(biz.is_open?'open':'closed')+'">'+(biz.is_open?'● Open now':'● Closed')+'</span>',
      subcatLabel?'<span class="store-tag">🏷️ '+subcatLabel+'</span>':'',
      biz.address?'<span class="store-tag">📍 '+biz.address+'</span>':'',
      biz.rating?'<span class="store-tag">★ '+biz.rating+'</span>':'',
      '<span class="store-tag">💬 WhatsApp orders</span>',
    ].filter(Boolean).join('');

    const { data: products } = await sb
      .from('products').select('*').eq('business_id',id).order('category').order('name');

    document.getElementById('prodSkeleton').style.display = 'none';

    if (!products||products.length===0) {
      document.getElementById('prodSections').innerHTML =
        '<div style="text-align:center;padding:60px 20px;color:var(--muted);font-size:14px;">No products listed yet. Check back soon.</div>';
    } else {
      renderProducts(products);
    }
    updateCartUI();
  }

  window.addEventListener('DOMContentLoaded', loadPage);
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Restaurants — Yora</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,700;1,9..144,400&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --saffron: #E8830A; --saffron-light: #FDF0DC; --saffron-dark: #B5630A;
    --cream: #FBF6EF; --dark: #1A1208; --dark2: #2D2010;
    --mid: #6B5030; --muted: #A08060; --white: #FFFFFF;
    --green: #1A6B3C; --green-light: #E8F5EE;
    --red: #C0392B; --red-light: #FDECEA;
    --border: rgba(26,18,8,0.1);
    --font-display: 'Fraunces', Georgia, serif;
    --font-body: 'DM Sans', system-ui, sans-serif;
  }
  html { scroll-behavior: smooth; }
  body { font-family: var(--font-body); background: var(--cream); color: var(--dark); min-height: 100vh; }

  /* NAV */
  nav {
    position: sticky; top: 0; z-index: 100;
    background: rgba(251,246,239,0.94); backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--border);
    padding: 0 5%; height: 64px;
    display: flex; align-items: center; justify-content: space-between;
  }
  .nav-logo { font-family: var(--font-display); font-size: 26px; font-weight: 700; color: var(--dark); text-decoration: none; }
  .nav-logo span { color: var(--saffron); }
  .nav-right { display: flex; align-items: center; gap: 12px; }
  .nav-link { font-size: 14px; font-weight: 500; color: var(--mid); text-decoration: none; padding: 8px 12px; border-radius: 10px; transition: all 0.2s; }
  .nav-link:hover { background: var(--saffron-light); color: var(--saffron-dark); }
  .nav-link.active { background: var(--saffron-light); color: var(--saffron-dark); font-weight: 600; }
  .nav-avatar { width: 36px; height: 36px; border-radius: 50%; background: var(--saffron); color: white; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 14px; cursor: pointer; text-decoration: none; }

  /* HERO BANNER */
  .hero-banner {
    background: var(--dark);
    padding: 52px 5% 48px;
    position: relative; overflow: hidden;
  }
  .hero-banner::before {
    content: ''; position: absolute; right: -60px; top: -60px;
    width: 400px; height: 400px; border-radius: 50%;
    background: radial-gradient(circle, rgba(232,131,10,0.15) 0%, transparent 65%);
    pointer-events: none;
  }
  .hero-banner::after {
    content: '🍽️'; position: absolute; right: 6%; bottom: -10px;
    font-size: 120px; opacity: 0.07; line-height: 1;
  }
  .breadcrumb { display: flex; align-items: center; gap: 6px; font-size: 13px; color: rgba(255,255,255,0.4); margin-bottom: 16px; }
  .breadcrumb a { color: rgba(255,255,255,0.4); text-decoration: none; transition: color 0.2s; }
  .breadcrumb a:hover { color: var(--saffron); }
  .breadcrumb span { color: rgba(255,255,255,0.2); }
  .hero-title { font-family: var(--font-display); font-size: clamp(32px, 4vw, 52px); font-weight: 700; color: var(--white); letter-spacing: -1px; line-height: 1.1; margin-bottom: 10px; }
  .hero-title em { color: var(--saffron); font-style: italic; font-weight: 300; }
  .hero-sub { font-size: 15px; color: rgba(255,255,255,0.5); max-width: 420px; line-height: 1.6; }
  .hero-stats { display: flex; gap: 28px; margin-top: 28px; }
  .h-stat-num { font-family: var(--font-display); font-size: 22px; font-weight: 700; color: var(--white); line-height: 1; }
  .h-stat-label { font-size: 12px; color: rgba(255,255,255,0.4); margin-top: 2px; }

  /* SEARCH + FILTER BAR */
  .filter-bar {
    background: var(--white); border-bottom: 1px solid var(--border);
    padding: 16px 5%; display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
    position: sticky; top: 64px; z-index: 90;
  }
  .search-wrap {
    flex: 1; min-width: 220px; max-width: 360px;
    display: flex; align-items: center; gap: 10px;
    background: var(--cream); border: 1.5px solid var(--border);
    border-radius: 50px; padding: 9px 16px;
    transition: border-color 0.2s;
  }
  .search-wrap:focus-within { border-color: var(--saffron); }
  .search-wrap input { flex: 1; border: none; background: transparent; outline: none; font-family: var(--font-body); font-size: 14px; color: var(--dark); min-width: 0; }
  .search-wrap input::placeholder { color: var(--muted); }
  .filter-chips { display: flex; gap: 8px; flex-wrap: wrap; }
  .chip {
    padding: 7px 16px; border-radius: 50px; font-family: var(--font-body);
    font-size: 13px; font-weight: 600; cursor: pointer; border: 1.5px solid var(--border);
    background: transparent; color: var(--mid); transition: all 0.2s;
  }
  .chip:hover { border-color: var(--saffron); color: var(--saffron); }
  .chip.active { background: var(--saffron); color: white; border-color: var(--saffron); }
  .results-count { margin-left: auto; font-size: 13px; color: var(--muted); white-space: nowrap; }

  /* MAIN GRID */
  .main { max-width: 1200px; margin: 0 auto; padding: 40px 5%; }

  /* SKELETON */
  .skeleton-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 24px; }
  .skeleton-card { background: var(--white); border-radius: 20px; overflow: hidden; }
  .skeleton-cover { height: 180px; background: linear-gradient(90deg, #f0e8dc 25%, #f8f2ea 50%, #f0e8dc 75%); background-size: 200% 100%; animation: shimmer 1.4s infinite; }
  .skeleton-body { padding: 20px; }
  .skeleton-line { height: 14px; border-radius: 7px; background: linear-gradient(90deg, #f0e8dc 25%, #f8f2ea 50%, #f0e8dc 75%); background-size: 200% 100%; animation: shimmer 1.4s infinite; margin-bottom: 10px; }
  .skeleton-line.short { width: 60%; }
  @keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }

  /* BUSINESS CARDS */
  .biz-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 24px; }

  .biz-card {
    background: var(--white); border-radius: 20px; overflow: hidden;
    text-decoration: none; color: inherit; display: block;
    transition: transform 0.3s, box-shadow 0.3s;
    opacity: 0; transform: translateY(20px);
    animation: cardIn 0.4s ease forwards;
    border: 1px solid transparent;
  }
  .biz-card:hover { transform: translateY(-6px); box-shadow: 0 16px 48px rgba(26,18,8,0.12); border-color: rgba(232,131,10,0.15); }

  @keyframes cardIn {
    to { opacity: 1; transform: translateY(0); }
  }

  .biz-cover {
    height: 180px; position: relative;
    display: flex; align-items: center; justify-content: center;
    font-size: 72px; overflow: hidden;
    background: linear-gradient(135deg, #FEF3C7 0%, #FDE68A 100%);
  }
  .biz-status {
    position: absolute; top: 12px; right: 12px;
    font-size: 11px; font-weight: 700; padding: 4px 10px; border-radius: 50px;
  }
  .biz-status.open { background: var(--green); color: white; }
  .biz-status.closed { background: rgba(26,18,8,0.35); color: rgba(255,255,255,0.8); }
  .biz-logo {
    position: absolute; bottom: -16px; left: 16px;
    width: 44px; height: 44px; border-radius: 12px;
    background: white; border: 3px solid white;
    box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    display: flex; align-items: center; justify-content: center;
    font-size: 22px;
  }
  .biz-body { padding: 26px 16px 18px; }
  .biz-name { font-size: 16px; font-weight: 700; color: var(--dark); margin-bottom: 4px; }
  .biz-desc { font-size: 13px; color: var(--muted); line-height: 1.5; margin-bottom: 14px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .biz-footer { display: flex; justify-content: space-between; align-items: center; padding-top: 12px; border-top: 1px solid var(--border); }
  .biz-rating { display: flex; align-items: center; gap: 4px; font-size: 13px; font-weight: 600; color: var(--saffron-dark); }
  .biz-orders { font-size: 12px; color: var(--muted); }
  .biz-arrow {
    width: 32px; height: 32px; border-radius: 50%;
    background: var(--saffron-light); color: var(--saffron);
    display: flex; align-items: center; justify-content: center;
    font-size: 14px; transition: all 0.2s;
  }
  .biz-card:hover .biz-arrow { background: var(--saffron); color: white; }

  /* EMPTY STATE */
  .empty-state { text-align: center; padding: 80px 20px; }
  .empty-icon { font-size: 56px; margin-bottom: 16px; }
  .empty-title { font-family: var(--font-display); font-size: 24px; font-weight: 700; color: var(--dark); margin-bottom: 8px; }
  .empty-sub { font-size: 14px; color: var(--muted); }

  /* RESPONSIVE */
  @media (max-width: 600px) {
    .biz-grid { grid-template-columns: 1fr; }
    .hero-stats { gap: 20px; }
    nav .nav-link { display: none; }
    .results-count { display: none; }
  }
</style>
</head>
<body>

<nav>
  <a href="index.html" class="nav-logo">Yora<span>.</span></a>
  <div class="nav-right">
    <a href="restaurants.html" class="nav-link active">Restaurants</a>
    <a href="pharmacies.html" class="nav-link">Pharmacies</a>
    <a href="delivery.html" class="nav-link">Delivery</a>
    <a href="dashboard.html" class="nav-avatar" id="navAvatar">?</a>
  </div>
</nav>

<div class="hero-banner">
  <div class="breadcrumb">
    <a href="index.html">Home</a>
    <span>/</span>
    <span>Restaurants</span>
  </div>
  <h1 class="hero-title">Yola's best<br><em>restaurants</em></h1>
  <p class="hero-sub">Order from local restaurants and get your food delivered — straight to your door via WhatsApp.</p>
  <div class="hero-stats">
    <div>
      <div class="h-stat-num" id="statCount">—</div>
      <div class="h-stat-label">Restaurants</div>
    </div>
    <div>
      <div class="h-stat-num" id="statOpen">—</div>
      <div class="h-stat-label">Open now</div>
    </div>
  </div>
</div>

<div class="filter-bar">
  <div class="search-wrap">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color:var(--muted);flex-shrink:0;"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
    <input type="text" id="searchInput" placeholder="Search restaurants or dishes…">
  </div>
  <div class="filter-chips">
    <button class="chip active" data-filter="all">All</button>
    <button class="chip" data-filter="open">Open now</button>
    <button class="chip" data-filter="top">Top rated</button>
  </div>
  <div class="results-count" id="resultsCount"></div>
</div>

<main class="main">
  <!-- Skeleton loader -->
  <div class="skeleton-grid" id="skeletonGrid">
    <div class="skeleton-card"><div class="skeleton-cover"></div><div class="skeleton-body"><div class="skeleton-line"></div><div class="skeleton-line short"></div></div></div>
    <div class="skeleton-card"><div class="skeleton-cover"></div><div class="skeleton-body"><div class="skeleton-line"></div><div class="skeleton-line short"></div></div></div>
    <div class="skeleton-card"><div class="skeleton-cover"></div><div class="skeleton-body"><div class="skeleton-line"></div><div class="skeleton-line short"></div></div></div>
  </div>

  <div class="biz-grid" id="bizGrid" style="display:none;"></div>
  <div class="empty-state" id="emptyState" style="display:none;">
    <div class="empty-icon">🍽️</div>
    <div class="empty-title">No restaurants found</div>
    <div class="empty-sub">Try a different search or check back later.</div>
  </div>
</main>

<script>
  const SUPABASE_URL      = 'https://fdwkdgqhnjyfupyevtkp.supabase.co';
  const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZkd2tkZ3Fobmp5ZnVweWV2dGtwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA2NjE2NjQsImV4cCI6MjA5NjIzNzY2NH0.g6ahJ2AfBbCtkeBKSOtfl0zzxUku5oE-zmp6AyiFaro';

  let sb, allRestaurants = [], activeFilter = 'all', searchQuery = '';

  function isOpenNow(opening, closing) {
    if (!opening || !closing) return true;
    const now  = new Date();
    const mins = now.getHours() * 60 + now.getMinutes();
    const [oh, om] = opening.split(':').map(Number);
    const [ch, cm] = closing.split(':').map(Number);
    return mins >= oh * 60 + om && mins <= ch * 60 + cm;
  }

  function renderCard(biz, index) {
    const open = biz.is_open && isOpenNow(biz.opening_time, biz.closing_time);
    const card = document.createElement('a');
    card.className = 'biz-card';
    card.href = 'restaurant.html?id=' + biz.id;
    card.style.animationDelay = (index * 60) + 'ms';
    card.innerHTML = `
      <div class="biz-cover" style="background:linear-gradient(135deg,#FEF3C7 0%,#FDE68A 100%);">
        <span>${biz.cover_emoji || '🍛'}</span>
        <span class="biz-status ${open ? 'open' : 'closed'}">${open ? 'Open' : 'Closed'}</span>
        <div class="biz-logo">${biz.logo_emoji || '🍽️'}</div>
      </div>
      <div class="biz-body">
        <div class="biz-name">${biz.name}</div>
        <div class="biz-desc">${biz.description || 'Local restaurant in Yola'}</div>
        <div class="biz-footer">
          <div>
            <div class="biz-rating">★ ${biz.rating || '—'} <span class="biz-orders">· ${biz.order_count || 0}+ orders</span></div>
          </div>
          <div class="biz-arrow">→</div>
        </div>
      </div>`;
    return card;
  }

  function applyFilters() {
    let list = [...allRestaurants];
    if (searchQuery) {
      const q = searchQuery.toLowerCase();
      list = list.filter(b => b.name.toLowerCase().includes(q) || (b.description || '').toLowerCase().includes(q));
    }
    if (activeFilter === 'open') {
      list = list.filter(b => b.is_open && isOpenNow(b.opening_time, b.closing_time));
    } else if (activeFilter === 'top') {
      list = list.filter(b => b.rating >= 4.5).sort((a, b) => b.rating - a.rating);
    }

    const grid  = document.getElementById('bizGrid');
    const empty = document.getElementById('emptyState');
    grid.innerHTML = '';

    if (list.length === 0) {
      grid.style.display = 'none';
      empty.style.display = 'block';
    } else {
      grid.style.display = 'grid';
      empty.style.display = 'none';
      list.forEach((biz, i) => grid.appendChild(renderCard(biz, i)));
    }

    document.getElementById('resultsCount').textContent = list.length + ' restaurant' + (list.length !== 1 ? 's' : '');
  }

  async function loadRestaurants() {
    sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // Auth state for nav avatar
    const { data: { session } } = await sb.auth.getSession();
    if (session) {
      const name = session.user.user_metadata?.first_name || session.user.email[0];
      document.getElementById('navAvatar').textContent = name.charAt(0).toUpperCase();
    }

    const { data, error } = await sb
      .from('businesses')
      .select('*')
      .eq('category', 'restaurant')
      .eq('is_approved', true)
      .order('order_count', { ascending: false });

    document.getElementById('skeletonGrid').style.display = 'none';
    document.getElementById('bizGrid').style.display = 'grid';

    if (error || !data) {
      document.getElementById('emptyState').style.display = 'block';
      document.getElementById('bizGrid').style.display = 'none';
      return;
    }

    allRestaurants = data;

    // Stats
    const openCount = data.filter(b => b.is_open && isOpenNow(b.opening_time, b.closing_time)).length;
    document.getElementById('statCount').textContent = data.length;
    document.getElementById('statOpen').textContent  = openCount;

    applyFilters();
  }

  // Filter chips
  document.querySelectorAll('.chip').forEach(chip => {
    chip.addEventListener('click', () => {
      document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
      chip.classList.add('active');
      activeFilter = chip.dataset.filter;
      applyFilters();
    });
  });

  // Search
  let searchTimer;
  document.getElementById('searchInput').addEventListener('input', (e) => {
    clearTimeout(searchTimer);
    searchTimer = setTimeout(() => {
      searchQuery = e.target.value.trim();
      applyFilters();
    }, 250);
  });

  window.addEventListener('DOMContentLoaded', loadRestaurants);
</script>
</body>
</html>
